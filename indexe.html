<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css" type="text/css">
</head>
<style>
    svg {
        display: block;
        margin-bottom: 10px;
    }
</style>

<body>
    <svg width="100" height="110" style="display: block;">
        <rect x="5" y="5" width="50" height="50" fill="olive" stroke-width="5" stroke="palegreen" />
    </svg>
    <svg width="200" height="100" style="display: block;">
        <rect x="5" y="5" width="100" height="50" fill="lightblue" stroke-width="5" stroke="moccasin" />
    </svg>
    <svg width="100" height="110" style="display: block;">
        <circle cx="50" cy="50" r="40" stroke-width="5" class="circle" />
    </svg>
    <svg width="400" height="400" style="display: block;">\
        <ellipse cx="120" cy="80" rx="100" ry="50" stroke-width="5" class="ellipse" />
    </svg>
</body>

</html>
